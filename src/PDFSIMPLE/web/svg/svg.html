<!DOCTYPE html>
<!--
  Visor de SVG: solo ver (abrir, acercar, alejar, ajustar). Lo sirve Ventana.cs en https://visor.local/svg/svg.html
  poniendo el idioma en la <meta>. El SVG va en un <img>: así nunca ejecuta los scripts que lleve dentro ni carga
  nada de fuera, se enseña como una imagen.
-->
<html>
<head>
<meta charset="utf-8" />
<meta name="lector-idioma" content="{{idioma}}" />
<title>SVG</title>
<style>
  :root { color-scheme: light dark; --barra: 34px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 13px "Segoe UI", system-ui, sans-serif; }
  body { background: #e6e6e6; color: #222; }
  @media (prefers-color-scheme: dark) { body { background: #2a2a2e; color: #ddd; } }

  #barra { position: fixed; inset: 0 0 auto 0; height: var(--barra); display: flex; align-items: center; gap: 2px;
           padding: 0 6px; background: #f9f9fa; border-bottom: 1px solid #ccc; white-space: nowrap; z-index: 1; }
  @media (prefers-color-scheme: dark) { #barra { background: #38383d; border-color: #0c0c0d; } }
  #barra button { height: 26px; min-width: 28px; padding: 0 8px; border: 0; border-radius: 3px; background: none;
                  color: inherit; font: inherit; cursor: pointer; }
  #barra button:hover { background: rgba(0,0,0,.1); }
  @media (prefers-color-scheme: dark) { #barra button:hover { background: rgba(255,255,255,.12); } }
  #barra .sep { width: 1px; height: 18px; background: rgba(128,128,128,.4); margin: 0 4px; }
  #zoom { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
  #nombre { margin-left: auto; padding-left: 12px; opacity: .7; overflow: hidden; text-overflow: ellipsis; }

  #lienzo { position: absolute; inset: var(--barra) 0 0 0; overflow: auto; display: grid; place-items: center; }
  #lienzo.mover { cursor: grab; }
  #lienzo.moviendo { cursor: grabbing; }
  /* Cuadros para que se vea dónde es transparente. */
  #img { display: block; margin: 16px; box-shadow: 0 0 0 1px rgba(0,0,0,.15);
         background: #fff conic-gradient(#eee 25%, #fff 0 50%, #eee 0 75%, #fff 0) 0 0 / 16px 16px; }
  #vacio { opacity: .7; }
</style>
</head>
<body>
<div id="barra">
  <button id="abrir"></button>
  <span class="sep"></span>
  <button id="menos">−</button>
  <span id="zoom"></span>
  <button id="mas">+</button>
  <button id="ajustar"></button>
  <button id="real">100 %</button>
  <span id="nombre"></span>
</div>
<div id="lienzo"><img id="img" alt="" draggable="false" hidden /><div id="vacio" hidden></div></div>
<script>
"use strict";
(function () {
  const idioma = { es: 0, fr: 1, en: 2 }[document.querySelector('meta[name="lector-idioma"]').content] ?? 0;
  const T = {
    abrir: ["Abrir (Ctrl+O)", "Ouvrir (Ctrl+O)", "Open (Ctrl+O)"],
    menos: ["Alejar (Ctrl+−)", "Zoom arrière (Ctrl+−)", "Zoom out (Ctrl+−)"],
    mas: ["Acercar (Ctrl++)", "Zoom avant (Ctrl++)", "Zoom in (Ctrl++)"],
    ajustar: ["Ajustar", "Ajuster", "Fit"],
    ajustarT: ["Ajustar a la ventana (Ctrl+0)", "Ajuster à la fenêtre (Ctrl+0)", "Fit to window (Ctrl+0)"],
    real: ["Tamaño real (Ctrl+1)", "Taille réelle (Ctrl+1)", "Actual size (Ctrl+1)"],
    error: ["No se puede enseñar este SVG.", "Impossible d'afficher ce SVG.", "This SVG can't be displayed."],
  };
  const t = k => T[k][idioma];
  const $ = id => document.getElementById(id);
  const img = $("img"), lienzo = $("lienzo"), vacio = $("vacio");

  $("abrir").textContent = t("abrir").replace(/ \(.*/, ""); $("abrir").title = t("abrir");
  $("menos").title = t("menos"); $("mas").title = t("mas");
  $("ajustar").textContent = t("ajustar"); $("ajustar").title = t("ajustarT");
  $("real").title = t("real");

  async function api(metodo) {
    const r = await fetch("/api/" + metodo, { method: "POST" });
    return r.json();
  }

  // Tamaño propio del dibujo: el de sus width/height; si no los trae, Chromium le da 300×150 con su proporción.
  let ancho = 0, alto = 0, escala = 1, ajustado = true;
  const PASOS = [0.1, 0.25, 0.33, 0.5, 0.67, 0.75, 1, 1.25, 1.5, 2, 3, 4, 6, 8, 12, 16, 24, 32];

  function pintar() {
    img.style.width = Math.max(1, Math.round(ancho * escala)) + "px";
    img.style.height = Math.max(1, Math.round(alto * escala)) + "px";
    $("zoom").textContent = Math.round(escala * 100) + " %";
    lienzo.classList.toggle("mover", lienzo.scrollWidth > lienzo.clientWidth || lienzo.scrollHeight > lienzo.clientHeight);
  }
  function escalaAjustada() {
    const w = lienzo.clientWidth - 32, h = lienzo.clientHeight - 32;
    return Math.max(0.01, Math.min(w / ancho, h / alto));
  }
  function ajustar() { if (!ancho) return; ajustado = true; escala = escalaAjustada(); pintar(); }
  function poner(nueva, cx, cy) {
    if (!ancho) return;
    nueva = Math.min(32, Math.max(0.05, nueva));
    // Se mantiene quieto el punto que hay bajo el ratón (o el centro).
    const r = lienzo.getBoundingClientRect();
    cx ??= r.width / 2; cy ??= r.height / 2;
    const fx = (lienzo.scrollLeft + cx) / lienzo.scrollWidth, fy = (lienzo.scrollTop + cy) / lienzo.scrollHeight;
    ajustado = false; escala = nueva; pintar();
    lienzo.scrollLeft = fx * lienzo.scrollWidth - cx;
    lienzo.scrollTop = fy * lienzo.scrollHeight - cy;
  }
  const acercar = (cx, cy) => poner(PASOS.find(p => p > escala + 1e-3) ?? escala * 1.25, cx, cy);
  const alejar = (cx, cy) => poner([...PASOS].reverse().find(p => p < escala - 1e-3) ?? escala / 1.25, cx, cy);

  async function cargar() {
    const e = await api("estado");
    if (!e.hay) return;
    document.title = e.nombre;
    $("nombre").textContent = e.nombre;
    img.onload = () => {
      ancho = img.naturalWidth || 300; alto = img.naturalHeight || 150;
      img.hidden = false; vacio.hidden = true; ajustar();
    };
    img.onerror = () => { img.hidden = true; vacio.hidden = false; vacio.textContent = t("error"); $("zoom").textContent = ""; };
    img.src = "/doc/" + e.version;
  }

  $("abrir").onclick = () => api("abrir");
  $("menos").onclick = () => alejar();
  $("mas").onclick = () => acercar();
  $("ajustar").onclick = ajustar;
  $("real").onclick = () => poner(1);
  window.addEventListener("resize", () => { if (ajustado) ajustar(); else pintar(); });

  lienzo.addEventListener("wheel", e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    const r = lienzo.getBoundingClientRect();
    (e.deltaY < 0 ? acercar : alejar)(e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  lienzo.addEventListener("dblclick", e => {
    const r = lienzo.getBoundingClientRect();
    if (ajustado) poner(Math.max(1, escala * 2), e.clientX - r.left, e.clientY - r.top); else ajustar();
  });

  // Arrastrar con el ratón para moverse por el dibujo cuando no cabe.
  let arrastre = null;
  lienzo.addEventListener("pointerdown", e => {
    if (e.button !== 0 || !lienzo.classList.contains("mover")) return;
    arrastre = { x: e.clientX, y: e.clientY, l: lienzo.scrollLeft, t: lienzo.scrollTop };
    lienzo.setPointerCapture(e.pointerId); lienzo.classList.add("moviendo");
  });
  lienzo.addEventListener("pointermove", e => {
    if (!arrastre) return;
    lienzo.scrollLeft = arrastre.l - (e.clientX - arrastre.x);
    lienzo.scrollTop = arrastre.t - (e.clientY - arrastre.y);
  });
  const soltar = () => { arrastre = null; lienzo.classList.remove("moviendo"); };
  lienzo.addEventListener("pointerup", soltar);
  lienzo.addEventListener("pointercancel", soltar);

  window.addEventListener("keydown", e => {
    if (!e.ctrlKey || e.altKey || e.metaKey) return;
    const k = e.key.toLowerCase();
    if (k === "o") api("abrir");
    else if (k === "+" || k === "=" || k === "add") acercar();
    else if (k === "-" || k === "subtract") alejar();
    else if (k === "0") ajustar();
    else if (k === "1") poner(1);
    else if (k === "w") api("cerrar");
    else return;
    e.preventDefault();
  });

  // Soltar archivos encima: se los pasa al programa, como en el visor de PDF.
  window.addEventListener("dragover", e => { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
  window.addEventListener("drop", e => {
    e.preventDefault();
    const archivos = [...e.dataTransfer.files];
    if (archivos.length) window.chrome?.webview?.postMessageWithAdditionalObjects("soltar", archivos);
  });

  cargar();
})();
</script>
</body>
</html>
